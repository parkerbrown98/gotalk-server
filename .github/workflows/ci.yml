name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  sqlc:
    name: sqlc in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - run: sqlc diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Integration tests start PostgreSQL and Redis with testcontainers via the runner's Docker.
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -n 1

  deploy:
    name: deploy artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v4
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Helm lint
        run: |
          helm lint deploy/helm/gotalk --set database.url='host=postgres.example.com user=gotalk dbname=gotalk sslmode=require'
          helm lint deploy/helm/gotalk --set postgresql.enabled=true --set redis.enabled=true
          helm lint deploy/helm/gotalk \
            --set database.url='host=postgres.example.com user=gotalk dbname=gotalk sslmode=require' \
            --set redis.url='redis://redis.example.com:6379/0' \
            --set replicaCount=2 \
            --set storage.driver=s3 \
            --set storage.s3.bucket=gotalk-media \
            --set storage.s3.region=us-east-1 \
            --set storage.s3.accessKeyId=dummy \
            --set storage.s3.secretAccessKey=dummy
      - name: Render and validate Helm manifests
        run: |
          helm template gotalk deploy/helm/gotalk --set postgresql.enabled=true --set redis.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -summary -
          helm template gotalk deploy/helm/gotalk \
            --set database.url='host=postgres.example.com user=gotalk dbname=gotalk sslmode=require' \
            --set redis.url='redis://redis.example.com:6379/0' \
            --set replicaCount=2 \
            --set storage.driver=s3 \
            --set storage.s3.bucket=gotalk-media \
            --set storage.s3.region=us-east-1 \
            --set storage.s3.accessKeyId=dummy \
            --set storage.s3.secretAccessKey=dummy \
            | kubeconform -strict -ignore-missing-schemas -summary -
      - name: Render and validate kustomize manifests
        run: |
          kubectl kustomize deploy/kubernetes | kubeconform -strict -ignore-missing-schemas -summary -

  build:
    runs-on: ubuntu-latest
    needs: [lint, sqlc, test, deploy]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gotalk-server
          tags: |
            type=ref,event=pr
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: binary (${{ matrix.goos }}/${{ matrix.goarch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, sqlc, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="gotalk-server_${version}_${GOOS}_${GOARCH}"
          bin=gotalk; [ "$GOOS" = windows ] && bin=gotalk.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$name/$bin" ./cmd/gotalk
          cp README.md config.example.yaml "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [binaries, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > checksums.txt
          # Tags with a pre-release suffix (v0.1.0-beta.1, -rc.1) are published as pre-releases.
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --verify-tag --generate-notes --title "$GITHUB_REF_NAME" *.tar.gz *.zip checksums.txt

apiVersion: batch/v1
kind: CronJob
metadata:
  name: gotalk-backup
  labels:
    app.kubernetes.io/name: gotalk
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gotalk
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/parkerbrown98/gotalk-server:latest
              imagePullPolicy: IfNotPresent
              command: ["/gotalk", "backup", "--upload", "--keep", "14"]
              envFrom:
                - configMapRef:
                    name: gotalk-config
                - secretRef:
                    name: gotalk-env
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir: {}

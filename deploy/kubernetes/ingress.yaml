apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotalk
  labels:
    app.kubernetes.io/name: gotalk
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - forum.example.com
      secretName: gotalk-tls
  rules:
    - host: forum.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gotalk
                port:
                  name: http

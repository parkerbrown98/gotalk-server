{{- if .Values.backup.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gotalk.fullname" . }}-backup
  labels:
    {{- include "gotalk.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "gotalk.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "gotalk.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: {{ include "gotalk.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /gotalk
                - backup
                - --upload
                - --keep
                - {{ .Values.backup.keep | quote }}
                {{- if .Values.backup.noMedia }}
                - --no-media
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- $envFrom := include "gotalk.envFrom" . }}
              {{- if $envFrom }}
              envFrom:
                {{- $envFrom | nindent 16 }}
              {{- end }}
              env:
                {{- include "gotalk.env" . | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- if eq (default "local" .Values.storage.driver) "local" }}
                - name: data
                  mountPath: /data
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
            {{- if eq (default "local" .Values.storage.driver) "local" }}
            - name: data
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ default (printf "%s-data" (include "gotalk.fullname" .)) .Values.persistence.existingClaim }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- end }}
          {{- with .Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

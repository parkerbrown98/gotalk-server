{{- $multi := or (gt (int .Values.replicaCount) 1) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.maxReplicas) 1)) -}}
{{- if and .Values.podDisruptionBudget.enabled $multi -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gotalk.fullname" . }}
  labels:
    {{- include "gotalk.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gotalk.selectorLabels" . | nindent 6 }}
{{- end }}


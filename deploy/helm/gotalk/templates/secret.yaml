{{- if include "gotalk.usesManagedSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gotalk.secretName" . }}
  labels:
    {{- include "gotalk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  GOTALK_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.redis.url }}
  GOTALK_REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.auth.jwtSecret }}
  GOTALK_AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.setup.admin.password }}
  GOTALK_SETUP_ADMIN_PASSWORD: {{ .Values.setup.admin.password | quote }}
  {{- end }}
  {{- if .Values.storage.s3.accessKeyId }}
  GOTALK_STORAGE_S3_ACCESS_KEY_ID: {{ .Values.storage.s3.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.storage.s3.secretAccessKey }}
  GOTALK_STORAGE_S3_SECRET_ACCESS_KEY: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.mail.smtp.password }}
  GOTALK_MAIL_SMTP_PASSWORD: {{ .Values.mail.smtp.password | quote }}
  {{- end }}
  {{- if .Values.mail.apiKey }}
  GOTALK_MAIL_API_KEY: {{ .Values.mail.apiKey | quote }}
  {{- end }}
  {{- if .Values.mail.accessKeyId }}
  GOTALK_MAIL_ACCESS_KEY_ID: {{ .Values.mail.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.mail.secretAccessKey }}
  GOTALK_MAIL_SECRET_ACCESS_KEY: {{ .Values.mail.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.voice.livekitApiKey }}
  GOTALK_VOICE_LIVEKIT_API_KEY: {{ .Values.voice.livekitApiKey | quote }}
  {{- end }}
  {{- if .Values.voice.livekitApiSecret }}
  GOTALK_VOICE_LIVEKIT_API_SECRET: {{ .Values.voice.livekitApiSecret | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  PGPASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
{{- end }}

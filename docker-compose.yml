# Gotalk quick start: `docker compose up -d`, then open the setup link printed by
# `docker compose logs gotalk`.
#
# For anything beyond local use, set POSTGRES_PASSWORD (and GOTALK_SERVER_PUBLIC_URL)
# in a .env file next to this one. See .env.example.
name: gotalk

services:
  gotalk:
    build: .
    image: ghcr.io/parkerbrown98/gotalk-server:latest
    restart: unless-stopped
    ports:
      - "${GOTALK_PORT:-8080}:8080"
    environment:
      GOTALK_DATABASE_URL: "host=postgres port=5432 user=gotalk dbname=gotalk sslmode=disable"
      PGPASSWORD: ${POSTGRES_PASSWORD:-gotalk}
      GOTALK_REDIS_URL: redis://redis:6379/0
      GOTALK_SERVER_PUBLIC_URL: ${GOTALK_SERVER_PUBLIC_URL:-}
      GOTALK_LOG_FORMAT: ${GOTALK_LOG_FORMAT:-text}
      # Optional object/file storage. Leave unset for the local /data volume.
      GOTALK_STORAGE_DRIVER: ${GOTALK_STORAGE_DRIVER:-}
      GOTALK_STORAGE_LOCAL_PATH: ${GOTALK_STORAGE_LOCAL_PATH:-/data}
      GOTALK_STORAGE_S3_ENDPOINT: ${GOTALK_STORAGE_S3_ENDPOINT:-}
      GOTALK_STORAGE_S3_REGION: ${GOTALK_STORAGE_S3_REGION:-}
      GOTALK_STORAGE_S3_BUCKET: ${GOTALK_STORAGE_S3_BUCKET:-}
      GOTALK_STORAGE_S3_PREFIX: ${GOTALK_STORAGE_S3_PREFIX:-}
      GOTALK_STORAGE_S3_ACCESS_KEY_ID: ${GOTALK_STORAGE_S3_ACCESS_KEY_ID:-}
      GOTALK_STORAGE_S3_SECRET_ACCESS_KEY: ${GOTALK_STORAGE_S3_SECRET_ACCESS_KEY:-}
      GOTALK_STORAGE_S3_FORCE_PATH_STYLE: ${GOTALK_STORAGE_S3_FORCE_PATH_STYLE:-}
      GOTALK_STORAGE_PUBLIC_URL: ${GOTALK_STORAGE_PUBLIC_URL:-}
      GOTALK_UPLOADS_MAX_SIZE: ${GOTALK_UPLOADS_MAX_SIZE:-}
      # Optional outbound mail. For local SMTP testing, see the "mail" profile below.
      GOTALK_MAIL_DRIVER: ${GOTALK_MAIL_DRIVER:-}
      GOTALK_MAIL_FROM: ${GOTALK_MAIL_FROM:-}
      GOTALK_MAIL_SMTP_HOST: ${GOTALK_MAIL_SMTP_HOST:-}
      GOTALK_MAIL_SMTP_PORT: ${GOTALK_MAIL_SMTP_PORT:-}
      GOTALK_MAIL_SMTP_USERNAME: ${GOTALK_MAIL_SMTP_USERNAME:-}
      GOTALK_MAIL_SMTP_PASSWORD: ${GOTALK_MAIL_SMTP_PASSWORD:-}
      GOTALK_MAIL_SMTP_TLS: ${GOTALK_MAIL_SMTP_TLS:-}
      GOTALK_MAIL_API_KEY: ${GOTALK_MAIL_API_KEY:-}
      GOTALK_MAIL_API_URL: ${GOTALK_MAIL_API_URL:-}
      GOTALK_MAIL_DOMAIN: ${GOTALK_MAIL_DOMAIN:-}
      GOTALK_MAIL_REGION: ${GOTALK_MAIL_REGION:-}
      GOTALK_MAIL_ACCESS_KEY_ID: ${GOTALK_MAIL_ACCESS_KEY_ID:-}
      GOTALK_MAIL_SECRET_ACCESS_KEY: ${GOTALK_MAIL_SECRET_ACCESS_KEY:-}
      # Optional headless setup: fill these in to skip the browser wizard.
      GOTALK_SETUP_ADMIN_USERNAME: ${GOTALK_SETUP_ADMIN_USERNAME:-}
      GOTALK_SETUP_ADMIN_EMAIL: ${GOTALK_SETUP_ADMIN_EMAIL:-}
      GOTALK_SETUP_ADMIN_PASSWORD: ${GOTALK_SETUP_ADMIN_PASSWORD:-}
      # Voice is enabled when GOTALK_VOICE_LIVEKIT_URL is set (see the "voice" profile below).
      GOTALK_VOICE_LIVEKIT_URL: ${GOTALK_VOICE_LIVEKIT_URL:-}
      GOTALK_VOICE_LIVEKIT_API_URL: ${GOTALK_VOICE_LIVEKIT_API_URL:-http://livekit:7880}
      GOTALK_VOICE_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-gotalk}
      GOTALK_VOICE_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-gotalk-local-voice-secret-change-me}
      # Let place webhooks reach addresses on your own network (e.g. a home automation hub).
      GOTALK_WEBHOOKS_ALLOW_PRIVATE_NETWORKS: ${GOTALK_WEBHOOKS_ALLOW_PRIVATE_NETWORKS:-false}
      # Link previews for links posted in chat and forum posts (on by default).
      GOTALK_EMBEDS_ENABLED: ${GOTALK_EMBEDS_ENABLED:-}
      GOTALK_EMBEDS_ALLOW_PRIVATE_NETWORKS: ${GOTALK_EMBEDS_ALLOW_PRIVATE_NETWORKS:-false}
    volumes:
      - gotalk-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotalk
      POSTGRES_DB: gotalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gotalk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotalk -d gotalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP testing. Mailpit UI: http://localhost:8025, SMTP: mailpit:1025.
  # Example:
  #   GOTALK_MAIL_DRIVER=smtp GOTALK_MAIL_SMTP_HOST=mailpit GOTALK_MAIL_SMTP_PORT=1025 GOTALK_MAIL_SMTP_TLS=none GOTALK_MAIL_FROM="Gotalk <noreply@localhost>" docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # Voice and video media server. Opt in with:
  #   GOTALK_VOICE_LIVEKIT_URL=ws://localhost:7880 docker compose --profile voice up -d
  # Clients connect to it directly, so beyond localhost set GOTALK_VOICE_LIVEKIT_URL to an
  # address they can reach (wss:// behind TLS), LIVEKIT_NODE_IP to this host's public IP,
  # and open 7881/tcp and 7882/udp.
  livekit:
    image: livekit/livekit-server:v1.13
    profiles: ["voice"]
    restart: unless-stopped
    command: ["--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
        keys:
          ${LIVEKIT_API_KEY:-gotalk}: ${LIVEKIT_API_SECRET:-gotalk-local-voice-secret-change-me}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-gotalk}
          urls:
            - http://gotalk:8080/api/v1/voice/webhook

volumes:
  gotalk-data:
  postgres-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset your password</title>
<style>
  :root { color-scheme: light dark; --accent: #5865f2; --ok: #23a55a; --err: #f23f43; --muted: #8a8f98; --line: color-mix(in srgb, currentColor 15%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  main { max-width: 420px; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: .9rem; }
  input { width: 100%; margin-top: 4px; padding: 9px 11px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  button { margin-top: 20px; width: 100%; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .error { color: var(--err); margin-top: 12px; min-height: 1.5em; }
  .ok { color: var(--ok); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <form id="form">
    <label>New password <span class="muted">(at least 10 characters)</span><input id="password" type="password" minlength="10" maxlength="256" autocomplete="new-password" required></label>
    <label>Confirm password <input id="password2" type="password" autocomplete="new-password" required></label>
    <div class="error" id="err"></div>
    <button id="submit">Set password</button>
  </form>
  <p id="done" class="ok" hidden>Your password was changed and you were signed out everywhere. Sign in again with your new password in your Gotalk app.</p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get("token") || "";
  history.replaceState(null, "", location.pathname);
  if (!token) { $("err").textContent = "This link is incomplete. Open the link from the email again."; $("submit").disabled = true; }
  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    if ($("password").value !== $("password2").value) { $("err").textContent = "Passwords do not match."; return; }
    $("err").textContent = ""; $("submit").disabled = true;
    try {
      const r = await fetch("/api/v1/auth/password-reset/confirm", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: $("password").value }),
      });
      if (!r.ok) { const p = await r.json().catch(() => ({})); throw new Error(p.detail || r.statusText); }
      $("form").hidden = true; $("done").hidden = false;
    } catch (err) { $("err").textContent = err.message; } finally { $("submit").disabled = false; }
  });
})();
</script>
</body>
</html>
